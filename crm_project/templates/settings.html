<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sozlamalar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
</head>
<body class="bg-gray-100">
    <!-- Navigatsiya paneli -->
    <nav class="bg-green-600 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">CRM Tizimi</h1>
            <ul class="flex space-x-4">
                <li><a href="{% url 'index' %}" class="hover:underline">Boshqaruv paneli</a></li>
                <li><a href="{% url 'clients_list' %}" class="hover:underline">Mijozlar</a></li>
                <li><a href="{% url 'add_client' %}" class="hover:underline">Yangi mijoz</a></li>
                <li><a href="{% url 'notifications' %}" class="hover:underline">Bildirishnomalar</a></li>
                <li><a href="{% url 'settings' %}" class="hover:underline">Sozlamalar</a></li>
            </ul>
        </div>
    </nav>

    <!-- Asosiy kontent -->
    <div class="container mx-auto p-6">
        <!-- Messages -->
        {% if messages %}
            <div class="mb-4">
                {% for message in messages %}
                    <div class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        <h2 class="text-2xl font-semibold mb-4">Sozlamalar</h2>
        <div class="bg-white p-6 rounded-lg shadow-md">
            <form method="post" class="space-y-6">
                {% csrf_token %}
                <!-- Til tanlash -->
                <div>
                    <label for="language" class="block text-sm font-medium text-gray-700">Tizim tili</label>
                    <select id="language" name="language" class="mt-1 block w-full md:w-1/3 border-gray-300 rounded-md shadow-sm p-2">
                        <option value="uz" {% if request.session.language == 'uz' %}selected{% endif %}>O‘zbek</option>
                        <option value="en" {% if request.session.language == 'en' %}selected{% endif %}>Ingliz</option>
                        <option value="ru" {% if request.session.language == 'ru' %}selected{% endif %}>Rus</option>
                    </select>
                </div>
                <!-- Fon rangi -->
                <div>
                    <label for="background-color" class="block text-sm font-medium text-gray-700">Fon rangi</label>
                    <input type="color" id="background-color" name="background-color" value="{{ request.session.background_color|default:'#f3f4f6' }}" class="mt-1 block w-20 h-10 border-gray-300 rounded-md shadow-sm">
                </div>
                <!-- Saqlash tugmasi -->
                <div>
                    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Saqlash</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
