<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CRM Tizimi{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: {{ request.session.background_color|default:'#f3f4f6' }};
        }
    </style>
</head>
<body class="bg-gray-100">
    <nav class="bg-green-600 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">CRM Tizimi</h1>
            <ul class="flex space-x-4">
                <li><a href="{% url 'index' %}" class="hover:underline">Boshqaruv paneli</a></li>
                <li><a href="{% url 'clients_list' %}" class="hover:underline">Mijozlar</a></li>
                <li><a href="{% url 'add_client' %}" class="hover:underline">Yangi mijoz</a></li>
                <li><a href="{% url 'notifications' %}" class="hover:underline">Bildirishnomalar</a></li>
                <li><a href="{% url 'settings' %}" class="hover:underline">Sozlamalar</a></li>
            </ul>
        </div>
    </nav>
    <div class="container mx-auto p-6">
        {% if messages %}
            <div class="mb-4">
                {% for message in messages %}
                    <div class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
