{% extends 'base.html' %}
{% block title %}Yangi mijoz qo‘shish{% endblock %}
{% block content %}
<h2 class="text-2xl font-semibold mb-4">Yangi mijoz qo‘shish</h2>
<form method="post" class="bg-white p-6 rounded-lg shadow-md">
    {% csrf_token %}
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label for="first-name" class="block text-sm font-medium text-gray-700">Ism</label>
            <input type="text" id="first-name" name="first-name" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2">
        </div>
        <div>
            <label for="last-name" class="block text-sm font-medium text-gray-700">Familiya</label>
            <input type="text" id="last-name" name="last-name" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2">
        </div>
        <div>
            <label for="phone" class="block text-sm font-medium text-gray-700">Telefon raqami</label>
            <input type="tel" id="phone" name="phone" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2">
        </div>
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
            <input type="email" id="email" name="email" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2">
        </div>
        <div>
            <label for="company" class="block text-sm font-medium text-gray-700">Kompaniya (ixtiyoriy)</label>
            <input type="text" id="company" name="company" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2">
        </div>
        <div>
            <label for="status" class="block text-sm font-medium text-gray-700">Status</label>
            <select id="status" name="status" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2">
                <option value="faol">Faol</option>
                <option value="passiv">Passiv</option>
            </select>
        </div>
    </div>
    <div class="mt-4">
        <label for="notes" class="block text-sm font-medium text-gray-700">Qo‘shimcha eslatma</label>
        <textarea id="notes" name="notes" rows="4" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2"></textarea>
    </div>
    <div class="mt-6">
        <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Saqlash</button>
    </div>
</form>
{% endblock %}
